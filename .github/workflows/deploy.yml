name: Deploy AI Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AIOPS_HOST }}
        username: ${{ secrets.AIOPS_USER }}
        key: ${{ secrets.AIOPS_SSH_KEY }}
        script: |
          cd ~/mlops-ai-service

          git pull origin main

          docker build -t mlops-ai-service .

          docker stop ai-service || true
          docker rm ai-service || true

          docker run -d \
            --name ai-service \
            -p 127.0.0.1:8000:8000 \
            mlops-ai-service